# Axle × tmux — makes tmux keep what the prompt relies on, with a Catppuccin Mocha
# status bar to match. Use it from ~/.tmux.conf with:
#
#   source-file ~/repos/axle/benzene/tmux.conf
#
# then reload a running tmux with:  tmux source-file ~/.tmux.conf
# (`axle tmux` prints this file.)

# --- what the prompt needs -------------------------------------------------------

# 24-bit colour, so the Catppuccin hex colours aren't rounded to the 256-colour palette.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Ctrl+click on the path and branch (OSC 8 hyperlinks; tmux 3.4+).
set -as terminal-features ",*:hyperlinks"
# Let escape sequences through to the outer terminal (shell-integration marks).
set -g  allow-passthrough on
# Esc is instant (matters for vi mode and the prompt's Alt-i).
set -sg escape-time 10
set -g  focus-events on
# Tab/window titles follow the pane title that oh-my-zsh sets.
set -g  set-titles on
set -g  set-titles-string "#{pane_title}"

# --- Catppuccin Mocha status bar --------------------------------------------------

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[bg=#181825,fg=#cba6f7]#[default] "
set -g status-right-length 60
set -g status-right "#[fg=#7f849c]#{pane_current_command}  #[fg=#89b4fa]#h #[fg=#7f849c]│ #[fg=#cdd6f4]%H:%M "
setw -g window-status-format " #[fg=#7f849c]#I #[fg=#a6adc8]#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #W #[default]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"
